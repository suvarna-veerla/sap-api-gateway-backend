# ===================================================================
# 🛡️ SAP S/4HANA RESILIENT PROXY GATEWAY CONFIGURATIONS
# ===================================================================

# 1. SERVER CONFIGURATION
# Moving to 8081 to completely fix the 'Port already in use 8080' error
server.port=8082

# 2. APPLICATION METADATA
spring.application.name=sap-resilient-api-gateway

# 3. SPRING WEB LOGGING LEVEL
# This displays detailed logs in the Eclipse console when APIs are accessed
logging.level.org.springframework.web=INFO
://level.com.hcl.gateway=DEBUG

# 4. JACKSON JSON FORMATTING
# This ensures that our SAP Sales Order fields (VBELN, MATNR) are neatly formatted in JSON
spring.jackson.serialization.indent_output=true
